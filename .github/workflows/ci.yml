
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Python
        uses: actions/setup-python@v5
        with:
           python-version: "3.12"

      - name: Install liblary
        run:  pip install -r requirements.txt

      - name: Jalankan pytest
        run: pytest 
        env:
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: test_db
          JWT_SECRET_KEY: test_secret_key

